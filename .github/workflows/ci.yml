name: AI Learning Lab CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Validate JSON content
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('data').glob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
              print(f'valid: {path}')
          PY

      - name: Content lint
        run: python scripts/check_terms.py

      - name: Accessibility static check
        run: python scripts/check_accessibility.py

      - name: Python tests
        run: python -m pytest -q

      - name: Local migration smoke
        run: python scripts/migrate.py

      - name: JavaScript syntax
        run: node --check app/app.js

  accessibility:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Start local server
        shell: bash
        run: |
          python -m uvicorn api.main:app --host 127.0.0.1 --port 8000 > lighthouse-server.log 2>&1 &
          echo $! > lighthouse-server.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health/ready >/dev/null; then exit 0; fi
            sleep 1
          done
          cat lighthouse-server.log
          exit 1

      - name: Run Lighthouse accessibility audit
        shell: bash
        run: |
          mkdir -p accessibility-artifacts
          for attempt in 1 2 3; do
            if ! npx --yes lighthouse@12.8.2 http://127.0.0.1:8000/?v=ci \
              --only-categories=accessibility,performance \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
              --output=json --output-path=accessibility-artifacts/lighthouse.json; then
              echo "Lighthouse command failed on attempt ${attempt}"
              sleep 3
              continue
            fi
            if python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('accessibility-artifacts/lighthouse.json').read_text())
          scores={key: round(value['score']*100, 1) for key,value in report['categories'].items()}
          print(scores)
          raise SystemExit(0 if scores.get('accessibility', 0) >= 90 and scores.get('performance', 0) >= 90 else 1)
          PY
            then
              exit 0
            fi
            echo "Lighthouse attempt ${attempt} below threshold, retrying"
            sleep 3
          done
          exit 1

      - name: Upload accessibility artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-audit
          path: |
            accessibility-artifacts
            lighthouse-server.log

      - name: Stop local server
        if: always()
        shell: bash
        run: test ! -f lighthouse-server.pid || kill "$(cat lighthouse-server.pid)" || true

  compose:
    runs-on: ubuntu-latest
    needs: quality
    env:
      APP_ENV: production
      SECRET_KEY: ci-secret-key-for-production-smoke-0123456789
      JWT_SECRET: ci-jwt-secret-for-production-smoke-0123456789
      POSTGRES_PASSWORD: ci-postgres-password-for-production-smoke
      DATABASE_URL: postgresql+psycopg://ailab:ci-postgres-password-for-production-smoke@db:5432/ailab
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose file
        run: docker compose config --quiet

      - name: Build application images
        run: docker compose build api worker

      - name: Start health-checked stack
        run: docker compose up -d db redis api worker caddy

      - name: Wait for readiness
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color api
          exit 1

      - name: Apply migrations and seed demo accounts
        run: |
          docker compose run --rm api python scripts/migrate.py
          docker compose run --rm api python scripts/migrate.py
          docker compose run --rm api python scripts/seed_db.py

      - name: Worker, sandbox, RAG and tutor smoke tests
        shell: bash
        run: |
          curl --fail --silent http://127.0.0.1:8000/api/sandbox/policy | grep -q 'worker-http'
          curl --fail --silent -X POST http://127.0.0.1:8000/api/code/run \
            -H 'Content-Type: application/json' \
            -d '{"code":"print(2 + 3)","timeout_seconds":3}' | grep -q '"status":"ok"'
          curl --fail --silent -X POST http://127.0.0.1:8000/api/rag/answer \
            -H 'Content-Type: application/json' \
            -d '{"question":"Что такое функция потерь?"}' | grep -q '"grounded":true'
          curl --fail --silent -X POST http://127.0.0.1:8000/api/tutor/ask \
            -H 'Content-Type: application/json' \
            -d '{"question":"Как работает градиентный спуск?"}' | grep -q 'leading_question'

      - name: Auth, profile and catalog smoke tests
        shell: bash
        run: |
          TOKEN=$(curl --fail --silent -X POST http://127.0.0.1:8000/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@ai-learning.local","password":"AdminPass123!"}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          curl --fail --silent http://127.0.0.1:8000/api/auth/me -H "Authorization: Bearer ${TOKEN}" | grep -q 'admin'
          curl --fail --silent http://127.0.0.1:8000/api/profile/me -H "Authorization: Bearer ${TOKEN}" | grep -q 'display_name'
          curl --fail --silent http://127.0.0.1:8000/api/admin/dashboard -H "Authorization: Bearer ${TOKEN}" | grep -q 'published_alumni'
          curl --fail --silent http://127.0.0.1:8000/api/exams | grep -q 'Демо-экзамен'
          curl --fail --silent http://127.0.0.1:8000/api/admin/audit -H "Authorization: Bearer ${TOKEN}" | grep -q 'auth.login'
          curl --fail --silent http://127.0.0.1:8000/api/alumni | grep -q 'Выпускник'

      - name: Backup and restore smoke test
        shell: bash
        run: |
          mkdir -p ci-backups
          docker compose exec -T db pg_dump --username ailab --dbname ailab --no-owner --no-privileges | gzip > ci-backups/ailab.sql.gz
          docker compose exec -T db createdb --username ailab ailab_restore_smoke
          gzip -dc ci-backups/ailab.sql.gz | docker compose exec -T db psql --username ailab --dbname ailab_restore_smoke --set ON_ERROR_STOP=1
          docker compose exec -T db psql --username ailab --dbname ailab_restore_smoke --command 'SELECT 1' | grep -q '1 row'
          docker compose exec -T db dropdb --username ailab ailab_restore_smoke

      - name: Smoke test API
        run: |
          curl --fail --silent http://127.0.0.1:8000/health/live
          curl --fail --silent http://127.0.0.1:8000/health/ready
          curl --fail --silent http://127.0.0.1/health/live
          curl --fail --silent http://127.0.0.1:8000/api/full-program | grep -q '"lessons"'

      - name: Collect logs
        if: always()
        run: docker compose logs --no-color > compose.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose.log

      - name: Upload backup smoke artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backup-smoke
          path: ci-backups

      - name: Stop stack
        if: always()
        run: docker compose down -v
